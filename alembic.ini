[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# ⚠️ Cette URL est un fallback uniquement.
# Alembic utilisera DATABASE_URL depuis .env (voir env.py)
sqlalchemy.url = postgresql+psycopg://127.0.0.1:5433/postgres

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
